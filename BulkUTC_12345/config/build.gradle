plugins {
    id 'java'
    id 'application'
    id 'distribution'
}

group = 'com.example.bulkutc'  // Placeholder, should be updated
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets {
    main {
        java {
            srcDirs = ['src/library', 'src/shopping_cart', 'src/university']
        }
    }
    test {
        java {
            srcDirs = ['tests/unit/library', 'tests/unit/shopping_cart', 'tests/unit/university']
        }
    }
}

application {
    mainClassName = 'com.example.bulkutc.MainClass'  // Placeholder, needs to be updated
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClassName
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}