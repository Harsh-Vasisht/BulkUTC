# Gradle performance improvements
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin incremental compilation (if needed)
kotlin.incremental=true

# Java compatibility
java.source=11
java.target=11

# Project settings
project.name=BulkUTC

# Microservice specific settings
microservice.port=8080

# Spring profiles (if using Spring Boot)
spring.profiles.active=dev

# Additional project-specific properties can be added here