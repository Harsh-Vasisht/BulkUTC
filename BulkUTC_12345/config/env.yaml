# Environment configurations for BulkUTC_12345

# Development environment
development:
  database:
    host: localhost
    port: 5432
    name: bulkutc_dev
    user: dev_user
    # Note: In a real-world scenario, we wouldn't store passwords in plain text
    password: dev_password

  api:
    base_url: http://api.dev.bulkutc.com
    version: v1

  logging:
    level: DEBUG
    output: console

  features:
    new_user_registration: true
    advanced_analytics: false

# Staging environment
staging:
  database:
    host: staging-db.bulkutc.com
    port: 5432
    name: bulkutc_staging
    user: staging_user
    password: staging_password

  api:
    base_url: http://api.staging.bulkutc.com
    version: v1

  logging:
    level: INFO
    output: file
    file_path: /var/log/bulkutc/staging.log

  features:
    new_user_registration: true
    advanced_analytics: true

# Production environment
production:
  database:
    host: prod-db.bulkutc.com
    port: 5432
    name: bulkutc_prod
    user: prod_user
    password: prod_password

  api:
    base_url: http://api.bulkutc.com
    version: v1

  logging:
    level: WARN
    output: file
    file_path: /var/log/bulkutc/production.log

  features:
    new_user_registration: true
    advanced_analytics: true

# Common configurations across all environments
common:
  timezone: UTC
  language: en-US
  max_upload_size: 10MB
  session_timeout: 30m

# Service connections
services:
  auth_service:
    url: http://auth.internal.bulkutc.com
    timeout: 5s
  analytics_service:
    url: http://analytics.internal.bulkutc.com
    timeout: 10s

# Add any additional configurations as needed